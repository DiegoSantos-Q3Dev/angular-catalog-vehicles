<div class="v-catalog-page-layout">
  <aside class="v-filters-sidebar">
    <v-aside-panel
      title="Filtros"
      icon="filter_alt"
      position="left"
      [collapseToButton]="true"
      [isOpen]="false"
      [fadeInPanel]="true">
        <v-catalog-filter (catalogFilterChanged)="onFilterChanged($event)" />
    </v-aside-panel>
  </aside>

  <div class="v-main-content-wrapper">
    <div class="v-content-header">
      <h2 style="padding: 15px 0;">🚗💨 Veículos elétricos, inspecionados e prontos</h2>
    </div>

    <main class="v-cards-content-area">
      @if (isLoading()) {
        <div class="v-loading-container">
          <mat-spinner diameter="48" color="primary"></mat-spinner>
          <p>Buscando os melhores veículos elétricos...</p>
        </div>
      } @else {

        <div class="v-cards-grid">
          @for (item of paginatedItens(); track item.id) {
            <v-catalog-card [item]="item" />
          } @empty {
            <div class="no-results-msg">Nenhum veículo encontrado.</div>
          }
        </div>

        @if (totalPages() > 1) {
          <div class="v-pagination-container">
            <button mat-stroked-button (click)="prevPage()" [disabled]="currentPage() === 1">
              Anterior
            </button>

            <span class="page-indicator">
              Página {{ currentPage() }} de {{ totalPages() }}
            </span>

            <button mat-stroked-button (click)="nextPage()" [disabled]="currentPage() === totalPages()">
              Próxima
            </button>
          </div>
        }
      }
    </main>
  </div>
</div>

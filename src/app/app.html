<div class="v-app-container" [class.v-side-navigation]="!showTopMenu()">
  @if (!showTopMenu()) {
    <v-aside-panel
      class="v-aside-nav"
      position="left"
      [hoverToOpen]="true"
      [clickToPin]="true"
      [showToggleWhenCollapsed]="false"
      [hideContentWhenCollapsed]="false"
      [(isPinned)]="isMenuPinned"
      [togglePlacement]="'edge'"
      [toggleIcons]="{ open: 'mouse_lock', closed: 'mouse' }"
      [isOpen]="false">
        <div aside-panel-header class="v-aside-brand">
          <img class="v-aside-brand-logo" src="images/logo.png" alt="V Catálogo">
          <span class="v-aside-brand-label">V Catálogo</span>
        </div>
        <v-nav-menu placement="side" [interactionMode]="isMenuPinned() ? 'click' : 'hover'" />
    </v-aside-panel>
  }

  <div class="v-app-content">
    <v-toolbar [(showTopMenu)]="showTopMenu" [(isTopMenuPinned)]="isMenuPinned"/>
    <div class="v-content-body">
      <main class="v-app-content">
        <router-outlet />
      </main>
      <v-aside-panel
        class="v-aside-right"
        title="HUB IA" icon="smart_toy"
        position="right"
        [collapseToButton]="true"
        [isOpen]="false"
        [fadeInPanel]="true">
          <v-ai-chat-page />
      </v-aside-panel>
    </div>

    <footer class="v-app-footer">
      <p>
        <span>&copy; {{ currentYear }} Diego Dos Santos -
          <mat-icon fontSet="fa-brands" fontIcon="fa-github"/>
          <a href="https://github.com/DiegoSantos18/angular-catalog-vehicles" target="_blank">GitHub</a>
        </span>
      </p>
    </footer>
  </div>
</div>
